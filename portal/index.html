<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a202c">
<meta name="robots" content="noindex">
<title>Client Portal | KPATEI Concept &amp; Build</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#1a202c;--slate:#2d3748;--cyan:#00d2ff;--cyanD:#009bbf;--ink:#1a202c;--text:#4a5568;--muted:#718096;--line:#e2e8f0;--bg:#f4f7fa;--card:#fff;
  --ok:#1e7a4c;--okS:#ddf1e5;--warn:#b7791f;--warnS:#fdf3dc;--bad:#b4352a;--badS:#f8e0dc;--live:#e02424;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Montserrat,sans-serif;color:var(--ink);margin:0;line-height:1.2}
h1{font-size:24px;font-weight:800}h2{font-size:19px;font-weight:800}h3{font-size:16px;font-weight:700}
a{color:var(--cyanD)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));min-height:60px}
.bar img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
.bar .t{min-width:0;flex:1}
.bar .t b{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{color:var(--cyan);font-size:12px;font-weight:600}
.bar .ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none;min-height:42px}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:var(--bad);border-color:#f0c4be}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.btn:disabled{opacity:.55;cursor:default}
label.l{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #cbd5e0;border-radius:12px;padding:11px 13px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.msg{font-size:14px;min-height:1.2em;margin:0}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#edf2f7;color:var(--slate);white-space:nowrap}
.pill.ok{background:var(--okS);color:var(--ok)}.pill.warn{background:var(--warnS);color:var(--warn)}.pill.bad{background:var(--badS);color:var(--bad)}.pill.cy{background:#dff8ff;color:#00708a}
.pill.live{background:var(--live);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
/* sign in */
.auth{max-width:420px;margin:28px auto}
.auth .logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px;text-align:center}
.auth .logo img{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.pw{display:flex;gap:6px}.pw input{flex:1}
.pw button{flex:none;border:1px solid #cbd5e0;background:#fff;border-radius:12px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.link{background:none;border:none;color:var(--cyanD);text-decoration:underline;padding:6px;font-size:14px}
/* project list */
.plist{display:grid;gap:12px}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit}
.pcard .th{width:76px;height:76px;border-radius:12px;background:#e2e8f0 center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:#a0aec0;font-family:Montserrat;font-weight:800}
.bar2{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cyanD),var(--cyan));border-radius:99px}
/* project page */
.hero{border-radius:18px;overflow:hidden;background:var(--dark) center/cover;color:#fff;position:relative;min-height:190px;display:flex;align-items:flex-end}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,32,44,.15),rgba(26,32,44,.92))}
.hero .in{position:relative;padding:18px;width:100%}
.hero h1{color:#fff}
.hero .bar2{background:rgba(255,255,255,.25)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:6px 11px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.stg.done{background:var(--okS);border-color:var(--okS);color:var(--ok)}
.stg.now{background:var(--dark);border-color:var(--dark);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:60px;z-index:10;background:var(--bg);padding:10px 0;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:none;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:14px;position:relative}
.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--live);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:4px}
.upd .head{display:flex;gap:10px;align-items:flex-start}
.upd .body{white-space:pre-wrap;color:var(--ink);margin:8px 0 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.fact b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mgrid.big{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.mthumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e2e8f0;border:none;padding:0}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;background:rgba(0,0,0,.25)}
.mthumb.sel{outline:3px solid var(--cyan);outline-offset:-3px}
.mthumb .n{position:absolute;top:6px;left:6px;background:var(--cyan);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-top:10px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.livebox{border:2px solid var(--live);border-radius:18px;padding:14px;background:#fff}
.doc{display:flex;gap:12px;align-items:center}
.doc .ic{width:42px;height:42px;border-radius:10px;background:#dff8ff;color:#00708a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--dark);color:#fff;border-color:var(--dark)}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.composer textarea{min-height:46px;height:46px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;background:var(--cyan);color:#fff;border:none;border-radius:999px;padding:15px 22px;font-weight:700;box-shadow:0 8px 24px rgba(0,155,191,.4);display:flex;gap:8px;align-items:center}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.sheet .pane{border-radius:20px}}
.sheet .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{margin-left:auto;background:var(--bg);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--muted)}
.prog{height:6px;border-radius:9px;background:#e2e8f0;overflow:hidden}.prog i{display:block;height:100%;background:var(--cyan);width:0;transition:width .2s}
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prev div{aspect-ratio:1;border-radius:8px;background:#e2e8f0 center/cover;position:relative;font-size:11px;color:#fff;display:flex;align-items:flex-end;padding:4px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer .vtop{display:flex;align-items:center;gap:10px;color:#fff;padding:12px 14px}
.viewer .vtop button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.viewer .vbody{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px}
.cmp{position:relative;width:100%;max-width:900px;aspect-ratio:4/3;overflow:hidden;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
.cmp .lab{position:absolute;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:Montserrat;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:80;background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.cred{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--cyanD);border-radius:12px;padding:12px;font-size:15px;word-break:break-all}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--cyanD)}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:12px}
  #print h1{font-size:22px}#print h2{font-size:16px;margin-top:18px}
  #print .pimg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #print .pimg img{width:100%;aspect-ratio:4/3;object-fit:cover}
  #print .pu{break-inside:avoid;border-top:1px solid #ccc;padding:8px 0}
}
</style>

<body>
<header class="bar">
  <a href="/" aria-label="KPATEI home"><img src="/logo.png" alt=""></a>
  <div class="t"><b id="barTitle">KPATEI CLIENT PORTAL</b><small id="barSub">Your project, live from site</small></div>
  <button class="ib" id="backBtn" type="button" hidden>‹ Projects</button>
  <button class="ib" id="meBtn" type="button" hidden>Account</button>
</header>
<main id="app"><div class="empty"><b>Loading…</b></div></main>
<button class="fab" id="fab" type="button" hidden>＋ Post update</button>
<div id="sheet" class="sheet" hidden><div class="pane" id="pane"></div></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
const SB_URL="https://skqkbrwckegcjaxcupaz.supabase.co";
const SB_KEY="sb_publishable_FkqxREmfD6xGVRLTyVOFFw_xscwWbFI";   // public key: safe to publish, data is protected by the database rules
const BUCKET="project-files";
const WHATSAPP="23278646003";
const STAGES=["Site preparation","Foundation","Blockwork","Lintel & columns","Roofing","Plastering","Electrical & plumbing","Tiling & finishing","Painting","Handover"];
const DOC_CATS=["Drawings","Building permit","Contract","Invoice / receipt","Report","Other"];
const PORTAL_URL=location.origin+"/portal/";

const app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
const fmtWhen=d=>{const t=new Date(d),n=new Date(),s=(n-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400&&t.getDate()===n.getDate())return"today "+t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});return fmtDate(d)+" "+t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function toast(t,ms){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||2600)}
function ytId(u){if(!u)return null;const m=String(u).match(/(?:youtu\.be\/|v=|\/live\/|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null}
const ytFrame=id=>`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe></div>`;
const waLink=(phone,text)=>"https://wa.me/"+String(phone||"").replace(/[^\d]/g,"")+"?text="+encodeURIComponent(text);

if(!window.supabase){app.innerHTML='<div class="empty"><b>Can\'t load the portal</b>Check your internet connection and try again.</div>';return}

// read what kind of link brought us here before the library clears it
const hashType=(new URLSearchParams(location.hash.slice(1))).get("type")||(new URLSearchParams(location.search)).get("type");
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});

let me=null, user=null, projects=[], cur=null, tab="updates", urlCache=new Map(), channel=null, people=[];
const isOwner=()=>me&&me.role==="owner", isStaff=()=>me&&me.role==="staff";
const canManage=p=>isOwner()||(isStaff()&&p&&p._staff&&p._staff.some(s=>s.user_id===me.id));

/* ---------- files ---------- */
async function signed(paths){
  const need=[...new Set(paths.filter(p=>p&&!urlCache.has(p)))];
  for(let i=0;i<need.length;i+=100){const {data}=await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100),3600*6);(data||[]).forEach(d=>{if(d.signedUrl)urlCache.set(d.path,d.signedUrl)})}
  return p=>urlCache.get(p)||"";
}
async function shrinkImage(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const max=1800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return b&&b.size<file.size?b:file}catch(e){return file}
}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function upload(pid,folder,file,onProg){
  const isImg=/^image\//.test(file.type),isVid=/^video\//.test(file.type);
  let blob=file,ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"bin";
  if(isImg&&!/gif|svg/.test(file.type)){blob=await shrinkImage(file);if(blob!==file)ext="jpg"}
  if(blob.size>50*1024*1024)throw new Error(file.name+" is larger than 50 MB. Put long videos on YouTube (Unlisted) and paste the link instead.");
  const path=`${pid}/${folder}/${rid()}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||file.type||"application/octet-stream",upsert:false});
  if(error)throw error;onProg&&onProg();
  return {path,type:isVid?"video":isImg?"image":"file",size:blob.size};
}

/* ---------- sign in ---------- */
function eyeBtns(root){root.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=root.querySelector("#"+b.dataset.eye);const on=i.type==="password";i.type=on?"text":"password";b.textContent=on?"Hide":"Show"})}
function viewSignIn(note){
  setBar();
  app.innerHTML=`<div class="auth">
   <div class="logo"><img src="/logo.png" alt="KPATEI Concept & Build"><h1>Client Portal</h1><p class="muted" style="margin:0">Follow your building project: photos, videos, live site visits and documents.</p></div>
   <form class="card stack" id="f" novalidate>
     <div><label class="l" for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email" required></div>
     <div><label class="l" for="pw">Password</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" data-eye="pw">Show</button></div></div>
     <button class="btn pri" id="go">Sign in</button>
     <p class="msg ${note&&note.ok?"ok":"err"}" id="m">${esc(note?note.text:"")}</p>
   </form>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="link" id="forgot" type="button">Forgot password?</button></div>
   <p class="muted" style="text-align:center;margin-top:16px">Accounts are given by KPATEI to clients with construction supervision. Not a client yet? <a href="${esc(waLink(WHATSAPP,"Hello KPATEI, I'd like construction supervision for my project."))}" target="_blank" rel="noopener">Talk to us on WhatsApp</a>.</p>
  </div>`;
  eyeBtns(app);
  $("#f").onsubmit=async e=>{e.preventDefault();const m=$("#m");m.className="msg err";m.textContent="";const go=$("#go");go.disabled=true;go.textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    go.disabled=false;go.textContent="Sign in";
    if(error){m.textContent=/invalid/i.test(error.message)?"Wrong email or password.":error.message;return}
    boot();};
  $("#forgot").onclick=async()=>{const m=$("#m"),em=$("#em").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(em)){m.className="msg err";m.textContent="Type your email above first, then tap Forgot password.";return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:PORTAL_URL});
    m.className="msg "+(error?"err":"ok");m.textContent=error?"Couldn't send the email right now. Ask KPATEI to reset your password on WhatsApp.":"If that email has an account, a link to set a new password is on its way. Check your inbox and spam.";};
}
function viewSetPassword(reason){
  setBar();
  app.innerHTML=`<div class="auth"><div class="logo"><img src="/logo.png" alt=""><h1>${reason==="first"?"Welcome!":"Set a new password"}</h1>
   <p class="muted" style="margin:0">${reason==="first"?"Please choose your own password. Only you will know it.":"Choose a new password for your account."}</p></div>
   <form class="card stack" id="f" novalidate>
    <div><label class="l" for="p1">New password</label><div class="pw"><input id="p1" type="password" autocomplete="new-password"><button type="button" data-eye="p1">Show</button></div><p class="muted" style="margin:4px 0 0">At least 8 characters. Mix letters and numbers.</p></div>
    <div><label class="l" for="p2">Type it again</label><div class="pw"><input id="p2" type="password" autocomplete="new-password"><button type="button" data-eye="p2">Show</button></div></div>

  eyeBtns(app);

}

function bubble(m){const mine=m.sender_id===me.id,who=m.sender?(m.sender.full_name||"")+(m.sender.role!=="client"?" · KPATEI":""):"";

const KIND={update:["Update","cy"],report:["Daily report",""],live:["Live video","live"],milestone:["Milestone","ok"]};
function updCard(u,url,mg){const k=KIND[u.kind]||KIND.update,ms=(u.media||[]).sort((a,b)=>a.created_at<b.created_at?-1:1),yid=ytId(u.youtube_url);
  const facts=[["Workers on site",u.workers],["Work done / materials",u.materials],["Problems / delays",u.issues],["Weather",u.weather]].filter(f=>f[1]!=null&&f[1]!=="");
  return `<article class="card upd"><div class="head"><div class="grow"><div class="row" style="gap:6px"><span class="pill ${k[1]}">${k[0]}</span>${u.stage?`<span class="pill">${esc(u.stage)}${u.progress!=null?" · "+u.progress+"%":""}</span>`:""}</div>
    ${u.title?`<h3 style="margin-top:8px">${esc(u.title)}</h3>`:""}<div class="muted">${esc(fmtWhen(u.created_at))}${u.author?" · "+esc(u.author.full_name):""}</div></div>${mg?`<button class="btn sm danger" data-delu="${u.id}" aria-label="Delete update">✕</button>`:""}</div>
    ${u.body?`<p class="body">${esc(u.body)}</p>`:""}${facts.length?`<div class="facts">${facts.map(f=>`<div class="fact"><b>${f[0]}</b>${esc(f[1])}</div>`).join("")}</div>`:""}
    ${yid?ytFrame(yid):""}${ms.length?`<div class="mgrid">${ms.slice(0,9).map(m=>thumb(m,url)).join("")}</div>${ms.length>9?`<p class="muted" style="margin:6px 0 0">+${ms.length-9} more in Photos &amp; videos</p>`:""}`:""}</article>`}
function thumb(m,url){const s=url(m.path);return `<button class="mthumb" type="button" data-m="${m.id}">${m.type==="video"?`<video src="${esc(s)}#t=0.5" preload="metadata" muted playsinline></video><span class="play">▶</span>`:`<img src="${esc(s)}" alt="${esc(m.caption||"Site photo")}" loading="lazy">`}</button>`}
function bindMedia(root,list,url){root.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=list.findIndex(m=>m.id===b.dataset.m);
  if(root.classList.contains("picking")){const m=list[i];if(m.type!=="image")return toast("Choose photos, not videos");root._pick=root._pick||[];root._pick.push(m);b.classList.add("sel");const n=document.createElement("span");n.className="n";n.textContent=root._pick.length;b.append(n);
    if(root._pick.length===2){compare(root._pick[0],root._pick[1],url);$("#cmpB").click()}return}
  openViewer(list,i,url)})}
function openViewer(list,i,url){const v=$("#viewer");let k=i;
  const draw=()=>{const m=list[k],s=url(m.path);v.innerHTML=`<div class="vtop"><span class="grow" style="font-size:14px">${k+1} / ${list.length} · ${esc(fmtDate(m.created_at))}</span><a href="${esc(s)}" download target="_blank" rel="noopener" style="color:#fff;font-size:14px;margin-right:6px">Save</a><button type="button" id="vx">Close</button></div>
    <div class="vbody">${m.type==="video"?`<video src="${esc(s)}" controls autoplay playsinline></video>`:`<img src="${esc(s)}" alt="">`}${list.length>1?'<button class="nav" style="left:8px" id="vp">‹</button><button class="nav" style="right:8px" id="vn">›</button>':""}</div>`;
    v.querySelector("#vx").onclick=()=>{v.hidden=true;v.innerHTML=""};const p=v.querySelector("#vp"),n=v.querySelector("#vn");if(p)p.onclick=()=>{k=(k-1+list.length)%list.length;draw()};if(n)n.onclick=()=>{k=(k+1)%list.length;draw()}};
  v.hidden=false;draw();let sx=null;v.ontouchstart=e=>sx=e.touches[0].clientX;v.ontouchend=e=>{if(sx==null||list.length<2)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){k=(k+(dx<0?1:-1)+list.length)%list.length;draw()}sx=null}}
function compare(a,b,url){const v=$("#viewer");v.hidden=false;
  v.innerHTML=`<div class="vtop"><span class="grow" style="font-size:14px">Drag to compare · ${esc(fmtDate(a.created_at))} → ${esc(fmtDate(b.created_at))}</span><button type="button" id="vx">Close</button></div>
   <div class="vbody"><div class="cmp" id="cmp"><img src="${esc(url(a.path))}" alt="Before"><img class="after" src="${esc(url(b.path))}" alt="After"><span class="handle"></span><span class="lab" style="left:10px">Before</span><span class="lab" style="right:10px">After</span></div></div>`;
  v.querySelector("#vx").onclick=()=>{v.hidden=true;v.innerHTML=""};const c=v.querySelector("#cmp");
  const set=x=>{const r=c.getBoundingClientRect(),pc=Math.max(0,Math.min(100,(x-r.left)/r.width*100));c.querySelector(".after").style.clipPath=`inset(0 0 0 ${pc}%)`;c.querySelector(".handle").style.left=pc+"%"};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);set(e.clientX)};c.onpointermove=e=>{if(e.buttons)set(e.clientX)}}

  openSheet("Post to "+p.title,`<form class="stack" id="f" novalidate>

    <div><label class="l" for="fi">Photos &amp; short videos</label><input id="fi" type="file" accept="image/*,video/*" multiple><p class="muted" style="margin:4px 0 0">Photos are made smaller automatically. Videos up to 50 MB; for longer videos use a YouTube link below.</p><div class="prev" id="pv" style="margin-top:8px"></div></div>
    <div><label class="l" for="yt">YouTube link (optional)</label><input id="yt" inputmode="url" placeholder="Paste an Unlisted YouTube video link"></div>
    <div class="prog" id="pg" hidden><i></i></div>
    <button class="btn pri" id="go">Post update</button><p class="msg err" id="m"></p></form>`,pane=>{

    q("#pr").oninput=e=>q("#prv").textContent=e.target.value;
    q("#fi").onchange=e=>{q("#pv").innerHTML=[...e.target.files].map(f=>/^image/.test(f.type)?`<div style="background-image:url('${URL.createObjectURL(f)}')"></div>`:`<div style="background:#2d3748">▶ ${(f.size/1048576).toFixed(0)}MB</div>`).join("")};
    q("#f").onsubmit=async e=>{e.preventDefault();const m=q("#m"),go=q("#go"),files=[...q("#fi").files];m.textContent="";

      go.disabled=true;q("#pg").hidden=false;const bar=q("#pg i");let done=0;const tick=()=>{done++;bar.style.width=Math.round(done/(files.length+1)*100)+"%";go.textContent="Uploading "+done+" of "+files.length+"…"};

    <label class="chk"><input type="checkbox" id="pst" checked> Also add it to Updates so the client can watch the recording later</label>
    <button class="btn pri">Show live to client</button><p class="msg err" id="m"></p></form>`,pane=>{
    pane.querySelector("#f").onsubmit=async e=>{e.preventDefault();const u=pane.querySelector("#u").value.trim(),t=pane.querySelector("#t").value.trim();if(!ytId(u))return pane.querySelector("#m").textContent="Paste the YouTube link of the live video.";
      const {error}=await sb.from("projects").update({live_url:u,live_title:t,live_at:new Date().toISOString()}).eq("id",p.id);if(error)return pane.querySelector("#m").textContent=error.message;
      if(pane.querySelector("#pst").checked)await sb.from("updates").insert({project_id:p.id,author_id:me.id,kind:"live",title:t,youtube_url:u,stage:p.stage,progress:p.progress});
      closeSheet();await openProject(p.id,true);
      if(p.client&&p.client.phone)openSheet("You're live",`<div class="stack"><a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(p.client.phone,"Hello "+(p.client.full_name||"").split(" ")[0]+", we're LIVE on your building site now! Watch here: "+PORTAL_URL+"#p/"+p.id))}">Tell client on WhatsApp</a><button class="btn" id="ok">Done</button></div>`,pp=>pp.querySelector("#ok").onclick=closeSheet);}});
}
async function endLive(){if(!confirm("End the live video on the client's page? (Stop the stream in YouTube too.)"))return;await sb.from("projects").update({live_url:null,live_at:null,live_title:null}).eq("id",cur.id);openProject(cur.id,true)}

/* ---------- handover pack (print to PDF) ---------- */
async function handoverPack(){
  toast("Preparing the pack…",6000);const p=cur;
  const [{data:ups},{data:docs},{data:sn}]=await Promise.all([sb.from("updates").select("*, author:profiles!updates_author_id_fkey(full_name), media(*)").eq("project_id",p.id).order("created_at",{ascending:true}),
    sb.from("documents").select("name,category,created_at").eq("project_id",p.id),sb.from("snags").select("item,status,fixed_at").eq("project_id",p.id)]);
  const url=await signed((ups||[]).flatMap(u=>(u.media||[]).filter(m=>m.type==="image").map(m=>m.path)));
  $("#print").innerHTML=`<div style="display:flex;gap:14px;align-items:center"><img src="/logo.png" style="width:70px"><div><h1>${esc(p.title)}</h1><div>${esc(p.location||"")} · Client: ${esc(p.client?p.client.full_name:"")}</div><div>KPATEI Concept &amp; Build · Handover pack · ${esc(fmtDate(new Date()))}</div></div></div>
    <p>Stage: ${esc(p.stage)} · ${p.progress}% · Started ${esc(fmtDate(p.start_date))}</p>
    <h2>Documents</h2><ul>${(docs||[]).map(d=>`<li>${esc(d.name)} (${esc(d.category)}, ${esc(fmtDate(d.created_at))})</li>`).join("")||"<li>None</li>"}</ul>
    <h2>Snag list</h2><ul>${(sn||[]).map(s=>`<li>${s.status==="fixed"?"✔":"✗"} ${esc(s.item)}</li>`).join("")||"<li>None</li>"}</ul>
    <h2>Project history</h2>${(ups||[]).map(u=>`<div class="pu"><b>${esc(fmtDate(u.created_at))} · ${esc(u.title||(KIND[u.kind]||KIND.update)[0])}</b>${u.stage?" · "+esc(u.stage):""}<div style="white-space:pre-wrap">${esc(u.body||"")}</div>
      ${u.youtube_url?`<div>Video: ${esc(u.youtube_url)}</div>`:""}<div class="pimg">${(u.media||[]).filter(m=>m.type==="image").map(m=>`<img src="${esc(url(m.path))}">`).join("")}</div></div>`).join("")}`;
  const imgs=[...$("#print").querySelectorAll("img")];await Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  $("#toast").hidden=true;window.print();
}

/* ---------- live refresh ---------- */
function subscribe(pid){
  if(channel){sb.removeChannel(channel);channel=null}
  channel=sb.channel("p-"+pid)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"project_id=eq."+pid},async pl=>{
      if(tab!=="chat"||!cur||cur.id!==pid)return;const {data}=await sb.from("messages").select("*, sender:profiles!messages_sender_id_fkey(full_name,role)").eq("id",pl.new.id).single();
      const ch=$("#chat");if(!ch||!data)return;$("#chatEmpty")?.remove();ch.insertAdjacentHTML("beforeend",bubble(data));window.scrollTo(0,document.body.scrollHeight)})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"updates",filter:"project_id=eq."+pid},pl=>{if(pl.new.author_id!==me.id)toast("New update posted");if(tab==="updates"&&pl.new.author_id!==me.id)setTimeout(renderTab,1500)})
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"projects",filter:"id=eq."+pid},pl=>{const was=liveNow(cur);Object.assign(cur,pl.new);if(liveNow(cur)!==was){if(liveNow(cur))toast("Live video started");renderProject()}})
    .subscribe();
}

/* ---------- routing ---------- */
async function route(){
  closeSheet();$("#viewer").hidden=true;window.scrollTo(0,0);
  if(!me)return;
  const h=location.hash;
  try{
    if(h.startsWith("#p/")){if(!projects.length)await loadProjects();await openProject(h.slice(3))}
    else if(h==="#people")await viewPeople();
    else{if(channel){sb.removeChannel(channel);channel=null}cur=null;await viewProjects()}
  }catch(err){app.innerHTML=`<div class="card empty"><b>Something went wrong</b>${esc(err.message||"Check your internet connection and try again.")}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`}
}
window.addEventListener("hashchange",route);

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return viewSignIn()}
  user=session.user;
  if(hashType==="recovery"||hashType==="invite"){if(!boot.done){boot.done=true;return viewSetPassword(hashType==="invite"?"first":"reset")}}
  if(user.user_metadata&&user.user_metadata.must_change_password)return viewSetPassword("first");
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error||!data){await sb.auth.signOut();return viewSignIn({text:"This account isn't set up yet. Please contact KPATEI."})}
  me=data;
  if(/^#(access_token|error)/.test(location.hash))history.replaceState(null,"",location.pathname);
  route();
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){viewSetPassword("reset")}if(ev==="SIGNED_OUT"){me=null}});
boot();
})();
</script>
